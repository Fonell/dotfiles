is_vim="tmux display -p '#{pane_current_command}' \
    | grep -iqE '(vim|view|vi|vimi|vimdiff|git)'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @minimal-tmux-status "top"
set -g @minimal-tmux-bg "#264F78"
set -g @minimal-tmux-fg "#D4D4D4"
set -g @minimal-tmux-indicator-str " "
set -g @minimal-tmux-left true
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

set -g xterm-keys on
set -g focus-events on
set -s set-clipboard on
set -g mouse on
set -g default-terminal "tmux-256color"
set -a terminal-features 'xterm-256color:RGB'
set -g pane-active-border-style fg=#569CD6
setw -g mode-keys vi

bind r source-file ~/.tmux.conf

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n C-left  if-shell "$is_vim" "send-keys C-left"  "select-pane -L"
bind -n C-down  if-shell "$is_vim" "send-keys C-down"  "select-pane -D"
bind -n C-up    if-shell "$is_vim" "send-keys C-up"    "select-pane -U"
bind -n C-right if-shell "$is_vim" "send-keys C-right" "select-pane -R"
bind -T copy-mode-vi C-left  select-pane -L
bind -T copy-mode-vi C-down  select-pane -D
bind -T copy-mode-vi C-up    select-pane -U
bind -T copy-mode-vi C-right select-pane -R

bind -n S-left  if-shell "$is_vim" "send-keys S-left"  "resize-pane -L 10"
bind -n S-down  if-shell "$is_vim" "send-keys S-down"  "resize-pane -D 5"
bind -n S-up    if-shell "$is_vim" "send-keys S-up"    "resize-pane -U 5"
bind -n S-right if-shell "$is_vim" "send-keys S-right" "resize-pane -R 10"
bind -T copy-mode-vi S-left  resize-pane -L 10
bind -T copy-mode-vi S-down  resize-pane -D 5
bind -T copy-mode-vi S-up    resize-pane -U 5
bind -T copy-mode-vi S-right resize-pane -R 10

run '~/.tmux/plugins/tpm/tpm'
